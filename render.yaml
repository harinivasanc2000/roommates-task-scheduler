databases:
  - name: homeflow-db
    databaseName: homeflow
    user: homeflow
    plan: free

services:
  - type: web
    name: homeflow-rota
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn roommate_scheduler.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
